# Local development. Source is bind-mounted and Django's autoreloader is on,
# so edits apply without a rebuild.
#
#   docker compose up --build
#
# There is no Postgres service here on purpose: Supabase is hosted, and the
# local sqlite database is only scaffolding for the demo.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Docker's gateway host has to be allowed or requests from the host
      # machine are rejected by ALLOWED_HOSTS.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      CADENCE_DB_PATH: /data/db.sqlite3
    volumes:
      # Live reload. The venv is deliberately not shadowed by the host.
      - ./backend:/app/backend
      - ./schemas:/app/schemas
      - ./fixtures:/app/fixtures
      # The database survives `docker compose down` — losing recorded visits
      # mid-demo would cost more than the disk does.
      - cadence-db:/data
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  cadence-db:
