# Local development. Source is bind-mounted for both services and each runs
# its own dev server with live reload, so edits apply without a rebuild.
#
#   docker compose up --build
#
# There is no Postgres service here: Supabase is hosted, and is the real data
# store (see backend/loop/). The local sqlite database is scaffolding for
# Django admin/sessions only.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Docker's gateway host has to be allowed or requests from the host
      # machine are rejected by ALLOWED_HOSTS.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      CADENCE_DB_PATH: /data/db.sqlite3
    volumes:
      # Live reload. The venv is deliberately not shadowed by the host.
      - ./backend:/app/backend
      - ./schemas:/app/schemas
      - ./fixtures:/app/fixtures
      - cadence-db:/data
    command: python manage.py runserver 0.0.0.0:8000

  web:
    build:
      context: ./web
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Live reload, same idea as backend: bind-mount source, but let
      # node_modules/.next stay inside the image/container rather than
      # being shadowed by (or shadowing) whatever's on the host.
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next
    depends_on:
      - backend

volumes:
  cadence-db:
  web-node-modules:
  web-next-cache:
